[package]
name = "proxy_bypass"
version = "1.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# replace the existing reqwest dependency
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ctrlc = "3.4"
